<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
<title>Folia WebView Stage</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #070a12;
    font-family: "Noto Sans CJK SC", "PingFang SC", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
    user-select: none; -webkit-user-select: none;
  }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #bg { z-index: 1; }
  #stage { z-index: 2; }
</style>
</head>
<body>
<canvas id="bg"></canvas>
<canvas id="stage"></canvas>
<script>
(() => {
  'use strict';

  const bgCanvas = document.getElementById('bg');
  const stageCanvas = document.getElementById('stage');
  const ctx = stageCanvas.getContext('2d', { alpha: true });

  // ======================== State ========================
  const S = {
    template: 'fume',
    track: { name: '', singer: '', picURL: '' },
    lyrics: [], // [{t, text, trans}]
    showTrans: true,
    accent: '#38BDF8',
    bright: '#7DD3FC',
    orb1: '#1E3A8A',
    orb2: '#312E81',
    posMs: 0,
    isPlaying: false,
    level: 0,
    smoothLevel: 0,
    lastTickPerf: performance.now(),
    activeIdx: -1,
    prevActiveIdx: -1,
    lineChangedAt: 0,
    camY: 0,
    camX: 0,
    camScale: 1,
    clockAngle: 0,
    coverImg: null,
    coverUrlLoaded: '',
    dpr: Math.min(window.devicePixelRatio || 1, 1.5),
    w: window.innerWidth || 1280,
    h: window.innerHeight || 720,
  };

  // Seeded pseudo-random for deterministic per-line/per-char choreography
  function hash(n) {
    let x = Math.sin(n * 127.1 + 311.7) * 43758.5453123;
    return x - Math.floor(x);
  }

  function hexToRgb(hex) {
    const m = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex || '#38BDF8');
    if (!m) return [56, 189, 248];
    return [parseInt(m[1], 16), parseInt(m[2], 16), parseInt(m[3], 16)];
  }

  function rgba(hex, a) {
    const [r, g, b] = hexToRgb(hex);
    return `rgba(${r},${g},${b},${a})`;
  }

  function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function easeOutCubic(t) { return 1 - Math.pow(1 - clamp(t, 0, 1), 3); }
  function easeOutBack(t) {
    const c1 = 1.70158, c3 = c1 + 1;
    const x = clamp(t, 0, 1) - 1;
    return 1 + c3 * x * x * x + c1 * x * x;
  }

  // ======================== WebGL Fluid Mesh Background ========================
  let gl = null, glProg = null, glLoc = null, bgCtx2d = null;
  function initBg() {
    try {
      gl = bgCanvas.getContext('webgl', { alpha: false, antialias: false, preserveDrawingBuffer: false });
      if (!gl) throw new Error('no webgl');
      const vsSrc = `
        attribute vec2 aPos;
        varying vec2 vUv;
        void main() {
          vUv = aPos * 0.5 + 0.5;
          gl_Position = vec4(aPos, 0.0, 1.0);
        }
      `;
      const fsSrc = `
        precision mediump float;
        varying vec2 vUv;
        uniform float uTime;
        uniform float uLevel;
        uniform vec3 uOrb1;
        uniform vec3 uOrb2;
        uniform vec3 uAccent;
        uniform float uStill;

        float wave(vec2 p, float t) {
          return sin(p.x * 2.4 + t * 0.45) * cos(p.y * 2.1 - t * 0.35)
               + 0.5 * sin(p.x * 4.3 - p.y * 3.1 + t * 0.7);
        }

        void main() {
          if (uStill > 0.5) {
            gl_FragColor = vec4(0.03, 0.04, 0.06, 1.0);
            return;
          }
          vec2 uv = vUv;
          float t = uTime * 0.55;
          vec2 p = uv * 2.0 - 1.0;
          float w1 = wave(p + vec2(sin(t * 0.3) * 0.4, cos(t * 0.25) * 0.4), t);
          float w2 = wave(p * 1.4 - vec2(cos(t * 0.22) * 0.5, sin(t * 0.28) * 0.3), -t * 0.8);

          vec3 base = vec3(0.025, 0.032, 0.055);
          float m1 = smoothstep(-0.8, 1.1, w1) * (0.48 + uLevel * 0.16);
          float m2 = smoothstep(-0.7, 1.2, w2) * (0.42 + uLevel * 0.14);
          float glow = exp(-length(p - vec2(sin(t * 0.4) * 0.45, cos(t * 0.33) * 0.35)) * 1.9);

          vec3 col = base;
          col = mix(col, uOrb1 * 0.72, clamp(m1, 0.0, 1.0));
          col = mix(col, uOrb2 * 0.68, clamp(m2 * 0.75, 0.0, 1.0));
          col += uAccent * glow * (0.24 + uLevel * 0.18);

          // Vignette + subtle film grain
          float vig = 1.0 - smoothstep(0.45, 1.35, length(p));
          col *= (0.55 + 0.45 * vig);
          float grain = fract(sin(dot(uv * 320.0 + uTime, vec2(12.9898, 78.233))) * 43758.5453);
          col += (grain - 0.5) * 0.022;

          gl_FragColor = vec4(clamp(col, 0.0, 1.0), 1.0);
        }
      `;
      const compile = (type, src) => {
        const sh = gl.createShader(type);
        gl.shaderSource(sh, src);
        gl.compileShader(sh);
        if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(sh));
        return sh;
      };
      glProg = gl.createProgram();
      gl.attachShader(glProg, compile(gl.VERTEX_SHADER, vsSrc));
      gl.attachShader(glProg, compile(gl.FRAGMENT_SHADER, fsSrc));
      gl.linkProgram(glProg);
      gl.useProgram(glProg);
      const buf = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, buf);
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
      const aPos = gl.getAttribLocation(glProg, 'aPos');
      gl.enableVertexAttribArray(aPos);
      gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);
      glLoc = {
        uTime: gl.getUniformLocation(glProg, 'uTime'),
        uLevel: gl.getUniformLocation(glProg, 'uLevel'),
        uOrb1: gl.getUniformLocation(glProg, 'uOrb1'),
        uOrb2: gl.getUniformLocation(glProg, 'uOrb2'),
        uAccent: gl.getUniformLocation(glProg, 'uAccent'),
        uStill: gl.getUniformLocation(glProg, 'uStill'),
      };
    } catch (_) {
      gl = null;
      bgCtx2d = bgCanvas.getContext('2d');
    }
  }

  function resize() {
    S.w = window.innerWidth || 1280;
    S.h = window.innerHeight || 720;
    S.dpr = Math.min(window.devicePixelRatio || 1, 1.5);
    // Render WebGL shader at half-res for smooth 60fps on Android TV GPUs
    const bgScale = 0.5;
    bgCanvas.width = Math.max(320, Math.floor(S.w * bgScale));
    bgCanvas.height = Math.max(180, Math.floor(S.h * bgScale));
    if (gl) gl.viewport(0, 0, bgCanvas.width, bgCanvas.height);
    stageCanvas.width = Math.floor(S.w * S.dpr);
    stageCanvas.height = Math.floor(S.h * S.dpr);
    ctx.setTransform(S.dpr, 0, 0, S.dpr, 0, 0);
  }

  function renderBg(tSec) {
    const isStill = S.template === 'still';
    if (gl && glProg) {
      const o1 = hexToRgb(S.orb1), o2 = hexToRgb(S.orb2), ac = hexToRgb(S.accent);
      gl.uniform1f(glLoc.uTime, tSec);
      gl.uniform1f(glLoc.uLevel, S.smoothLevel);
      gl.uniform3f(glLoc.uOrb1, o1[0]/255, o1[1]/255, o1[2]/255);
      gl.uniform3f(glLoc.uOrb2, o2[0]/255, o2[1]/255, o2[2]/255);
      gl.uniform3f(glLoc.uAccent, ac[0]/255, ac[1]/255, ac[2]/255);
      gl.uniform1f(glLoc.uStill, isStill ? 1.0 : 0.0);
      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    } else if (bgCtx2d) {
      const bw = bgCanvas.width, bh = bgCanvas.height;
      bgCtx2d.fillStyle = '#070a12';
      bgCtx2d.fillRect(0, 0, bw, bh);
      if (!isStill) {
        const x1 = bw * (0.3 + 0.2 * Math.sin(tSec * 0.4));
        const y1 = bh * (0.35 + 0.2 * Math.cos(tSec * 0.35));
        const g1 = bgCtx2d.createRadialGradient(x1, y1, 0, x1, y1, bw * 0.7);
        g1.addColorStop(0, rgba(S.orb1, 0.55));
        g1.addColorStop(1, 'rgba(0,0,0,0)');
        bgCtx2d.fillStyle = g1;
        bgCtx2d.fillRect(0, 0, bw, bh);
        const x2 = bw * (0.72 + 0.18 * Math.cos(tSec * 0.32));
        const y2 = bh * (0.68 + 0.18 * Math.sin(tSec * 0.38));
        const g2 = bgCtx2d.createRadialGradient(x2, y2, 0, x2, y2, bw * 0.65);
        g2.addColorStop(0, rgba(S.accent, 0.32));
        g2.addColorStop(1, 'rgba(0,0,0,0)');
        bgCtx2d.fillStyle = g2;
        bgCtx2d.fillRect(0, 0, bw, bh);
      }
    }
  }

  // ======================== Lyric Helpers ========================
  function findActiveIndex(posSec) {
    const arr = S.lyrics;
    if (!arr.length) return -1;
    let lo = 0, hi = arr.length - 1, ans = -1;
    while (lo <= hi) {
      const mid = (lo + hi) >> 1;
      if (arr[mid].t <= posSec + 0.06) { ans = mid; lo = mid + 1; }
      else hi = mid - 1;
    }
    return ans;
  }

  function lineProgress(idx, posSec) {
    const cur = S.lyrics[idx];
    if (!cur) return 0;
    const nxt = S.lyrics[idx + 1];
    const dur = nxt && nxt.t > cur.t ? clamp(nxt.t - cur.t, 1.0, 9.0) : 4.2;
    return clamp((posSec - cur.t) / dur, 0, 1);
  }

  function wrapLines(text, maxWidth, font) {
    if (!text) return [''];
    ctx.font = font;
    if (ctx.measureText(text).width <= maxWidth) return [text];
    const lines = [];
    let buf = '';
    for (const ch of text) {
      if (ctx.measureText(buf + ch).width > maxWidth && buf.length > 0) {
        lines.push(buf);
        buf = ch;
      } else {
        buf += ch;
      }
    }
    if (buf) lines.push(buf);
    return lines;
  }

  function drawRoundedRect(x, y, w, h, r) {
    const rr = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + rr, y);
    ctx.arcTo(x + w, y, x + w, y + h, rr);
    ctx.arcTo(x + w, y + h, x, y + h, rr);
    ctx.arcTo(x, y + h, x, y, rr);
    ctx.arcTo(x, y, x + w, y, rr);
    ctx.closePath();
  }

  // Persistent particle pool for Hanabi / Lumiere / Nebbia
  const particles = [];
  function spawnFirework(cx, cy, color) {
    const count = 42;
    for (let i = 0; i < count; i++) {
      const ang = (Math.PI * 2 * i) / count + (Math.random() - 0.5) * 0.15;
      const spd = 1.8 + Math.random() * 5.2;
      particles.push({
        x: cx, y: cy,
        vx: Math.cos(ang) * spd,
        vy: Math.sin(ang) * spd - 0.6,
        life: 1.0,
        decay: 0.011 + Math.random() * 0.012,
        size: 1.6 + Math.random() * 2.8,
        color,
      });
    }
    if (particles.length > 260) particles.splice(0, particles.length - 260);
  }

  // ======================== 18 Folia Stage Renderers ========================
  function drawTemplate(tpl, tSec, posSec, active, prog, sinceChange) {
    const W = S.w, H = S.h;
    const cur = S.lyrics[active];
    const curText = cur ? cur.text : (S.track.name || '♪');
    const curTrans = (cur && S.showTrans && cur.trans) ? cur.trans : '';

    // 1. STILL — 静止
    if (tpl === 'still') {
      ctx.save();
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      const font = `700 ${Math.round(H * 0.058)}px sans-serif`;
      const lines = wrapLines(curText, W * 0.82, font);
      ctx.font = font;
      ctx.fillStyle = '#F8FAFC';
      const lh = H * 0.082;
      const startY = H * 0.48 - ((lines.length - 1) * lh) / 2;
      lines.forEach((l, i) => ctx.fillText(l, W * 0.5, startY + i * lh));
      if (curTrans) {
        ctx.font = `500 ${Math.round(H * 0.03)}px sans-serif`;
        ctx.fillStyle = 'rgba(226,232,240,0.68)';
        ctx.fillText(curTrans, W * 0.5, startY + lines.length * lh + 16);
      }
      ctx.restore();
      return;
    }

    // 2. CLASSIC — 经典流光
    if (tpl === 'classic') {
      const targetY = active * 102;
      S.camY = lerp(S.camY, targetY, 0.11);
      ctx.save();
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      for (let i = Math.max(0, active - 4); i <= Math.min(S.lyrics.length - 1, active + 5); i++) {
        const line = S.lyrics[i];
        const dy = i * 102 - S.camY;
        const y = H * 0.48 + dy;
        const dist = Math.abs(dy) / 102;
        const isAct = i === active;
        const alpha = isAct ? 1 : clamp(0.42 - dist * 0.1, 0.07, 0.42);
        const sc = isAct ? 1.12 : clamp(0.86 - dist * 0.04, 0.72, 0.86);
        ctx.save();
        ctx.translate(W * 0.5, y);
        ctx.scale(sc, sc);
        ctx.globalAlpha = alpha;
        ctx.font = `700 ${Math.round(H * 0.052)}px sans-serif`;
        if (isAct) {
          ctx.shadowColor = S.accent;
          ctx.shadowBlur = 28;
          ctx.fillStyle = S.bright;
        } else {
          ctx.fillStyle = '#E2E8F0';
        }
        ctx.fillText(line.text, 0, 0);
        if (isAct && S.showTrans && line.trans) {
          ctx.shadowBlur = 0;
          ctx.font = `500 ${Math.round(H * 0.026)}px sans-serif`;
          ctx.fillStyle = 'rgba(255,255,255,0.75)';
          ctx.fillText(line.trans, 0, H * 0.055);
        }
        ctx.restore();
      }
      ctx.restore();
      return;
    }

    // 3. CADENZA — 心象（单字散落浮现）
    if (tpl === 'cadenza') {
      const chars = Array.from(curText.replace(/\s+/g, ''));
      const n = Math.max(1, chars.length);
      ctx.save();
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      for (let i = 0; i < n; i++) {
        const seed = (active + 1) * 97 + i * 13;
        const col = i % Math.min(n, 7);
        const row = Math.floor(i / 7);
        const rows = Math.ceil(n / 7);
        const baseX = W * (0.18 + 0.64 * ((col + 0.5) / Math.min(n, 7))) + (hash(seed) - 0.5) * W * 0.09;
        const baseY = H * (0.34 + 0.32 * ((row + 0.5) / Math.max(1, rows))) + (hash(seed + 1) - 0.5) * H * 0.14;
        const delay = (i / n) * 0.45;
        const localP = easeOutBack((sinceChange - delay * 0.6) / 0.55);
        const driftX = Math.sin(tSec * 0.8 + seed) * 14;
        const driftY = Math.cos(tSec * 0.7 + seed * 1.3) * 12;
        const sang = i / n <= prog + 0.08;
        const sz = H * (0.075 + hash(seed + 2) * 0.045);
        ctx.save();
        ctx.translate(baseX + driftX, baseY + driftY);
        ctx.rotate((hash(seed + 3) - 0.5) * 0.24);
        ctx.scale(localP * (sang ? 1.12 : 0.92), localP * (sang ? 1.12 : 0.92));
        ctx.globalAlpha = clamp(localP, 0, 1) * (sang ? 1.0 : 0.36);
        ctx.font = `800 ${Math.round(sz)}px sans-serif`;
        if (sang) {
          ctx.shadowColor = S.accent;
          ctx.shadowBlur = 26;
          ctx.fillStyle = '#FFFFFF';
        } else {
          ctx.fillStyle = rgba(S.bright, 0.85);
        }
        ctx.fillText(chars[i], 0, 0);
        ctx.restore();
      }
      if (curTrans) {
        ctx.globalAlpha = easeOutCubic(sinceChange / 0.5) * 0.72;
        ctx.font = `500 ${Math.round(H * 0.026)}px sans-serif`;
        ctx.fillStyle = S.bright;
        ctx.fillText(curTrans, W * 0.5, H * 0.82);
      }
      ctx.restore();
      return;
    }

    // 4. PARTITA — 云阶（沿引导线逐块错落下行）
    if (tpl === 'partita') {
      const stepY = H * 0.145;
      S.camY = lerp(S.camY, active * stepY, 0.1);
      ctx.save();
      // Diagonal guide line
      ctx.strokeStyle = rgba(S.bright, 0.22);
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(W * 0.12, H * 0.1);
      ctx.lineTo(W * 0.86, H * 0.9);
      ctx.stroke();

      ctx.textAlign = 'left';
      ctx.textBaseline = 'middle';
      for (let i = Math.max(0, active - 3); i <= Math.min(S.lyrics.length - 1, active + 4); i++) {
        const line = S.lyrics[i];
        const dy = i * stepY - S.camY;
        const y = H * 0.46 + dy;
        const stepOffset = ((i % 4) * W * 0.095);
        const x = W * 0.14 + stepOffset + dy * 0.38;
        const isAct = i === active;
        const dist = Math.abs(dy) / stepY;
        ctx.save();
        ctx.globalAlpha = isAct ? 1 : clamp(0.45 - dist * 0.12, 0.08, 0.45);
        // Step marker dot + hairline
        ctx.fillStyle = isAct ? S.accent : 'rgba(255,255,255,0.35)';
        ctx.beginPath();
        ctx.arc(x - 22, y, isAct ? 6 : 3.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.font = `${isAct ? 800 : 600} ${Math.round(H * (isAct ? 0.056 : 0.04))}px sans-serif`;
        if (isAct) {
          ctx.shadowColor = S.accent;
          ctx.shadowBlur = 24;
          ctx.fillStyle = '#FFFFFF';
        } else {
          ctx.fillStyle = '#CBD5E1';
        }
        ctx.fillText(line.text, x, y);
        if (isAct && S.showTrans && line.trans) {
          ctx.shadowBlur = 0;
          ctx.font = `500 ${Math.round(H * 0.025)}px sans-serif`;
          ctx.fillStyle = S.bright;
          ctx.fillText(line.trans, x, y + H * 0.05);
        }
        ctx.restore();
      }
      ctx.restore();
      return;
    }

    // 5. FUME — 浮名（满屏堆叠巨字 + 镜头推移浮沉）
    if (tpl === 'fume') {
      const rowH = H * 0.175;
      S.camY = lerp(S.camY, active * rowH, 0.085);
      const camZoom = 1.0 + Math.sin(tSec * 0.45) * 0.025 + S.smoothLevel * 0.03;
      ctx.save();
      ctx.translate(W * 0.5, H * 0.5);
      ctx.scale(camZoom, camZoom);
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      for (let i = Math.max(0, active - 4); i <= Math.min(S.lyrics.length - 1, active + 5); i++) {
        const line = S.lyrics[i];
        const dy = i * rowH - S.camY;
        const dist = Math.abs(dy) / rowH;
        const isAct = i === active;
        const driftX = Math.sin(tSec * 0.55 + i * 1.1) * (isAct ? 6 : 22);
        const sc = isAct ? 1.14 : clamp(0.92 - dist * 0.09, 0.65, 0.92);
        const alpha = isAct ? 1.0 : clamp(0.32 - dist * 0.08, 0.05, 0.32);
        ctx.save();
        ctx.translate(driftX, dy);
        ctx.scale(sc, sc);
        ctx.globalAlpha = alpha;
        ctx.font = `900 ${Math.round(H * 0.072)}px sans-serif`;
        if (isAct) {
          ctx.shadowColor = S.accent;
          ctx.shadowBlur = 34;
          ctx.fillStyle = '#FFFFFF';
        } else {
          ctx.fillStyle = rgba(S.bright, 0.78);
        }
        ctx.fillText(line.text, 0, 0);
        if (isAct && S.showTrans && line.trans) {
          ctx.shadowBlur = 0;
          ctx.font = `500 ${Math.round(H * 0.027)}px sans-serif`;
          ctx.fillStyle = rgba('#F1F5F9', 0.76);
          ctx.fillText(line.trans, 0, H * 0.068);
        }
        ctx.restore();
      }
      ctx.restore();
      return;
    }

    // 6. CAPPELLA — 群唱（聊天气泡左右对唱）
    if (tpl === 'cappella') {
      const stepY = H * 0.16;
      S.camY = lerp(S.camY, active * stepY, 0.11);
      ctx.save();
      ctx.textBaseline = 'middle';
      for (let i = Math.max(0, active - 3); i <= Math.min(S.lyrics.length - 1, active + 3); i++) {
        const line = S.lyrics[i];
        const dy = i * stepY - S.camY;
        const y = H * 0.5 + dy;
        const isRight = i % 2 === 1;
        const isAct = i === active;
        const dist = Math.abs(dy) / stepY;
        const alpha = isAct ? 1 : clamp(0.45 - dist * 0.12, 0.08, 0.45);
        const pop = isAct ? easeOutBack(sinceChange / 0.38) : 0.92;
        const font = `700 ${Math.round(H * 0.036)}px sans-serif`;
        ctx.font = font;
        const tw = Math.min(ctx.measureText(line.text).width, W * 0.56);
        const bw = tw + 56, bh = (isAct && S.showTrans && line.trans) ? H * 0.12 : H * 0.088;
        const bx = isRight ? W * 0.86 - bw : W * 0.14;
        const avX = isRight ? W * 0.895 : W * 0.105;

        ctx.save();
        ctx.globalAlpha = alpha;
        // Avatar circle
        ctx.fillStyle = isRight ? S.accent : S.orb2;
        ctx.beginPath();
        ctx.arc(avX, y, 22, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#FFFFFF';
        ctx.font = '700 16px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(isRight ? '♪' : '♫', avX, y + 1);

        // Bubble
        ctx.translate(bx + bw / 2, y);
        ctx.scale(pop, pop);
        drawRoundedRect(-bw / 2, -bh / 2, bw, bh, 24);
        ctx.fillStyle = isAct ? rgba(isRight ? S.accent : '#1E293B', 0.85) : 'rgba(255,255,255,0.10)';
        ctx.fill();
        ctx.strokeStyle = isAct ? rgba(S.bright, 0.75) : 'rgba(255,255,255,0.15)';
        ctx.lineWidth = isAct ? 2 : 1;
        ctx.stroke();

        ctx.textAlign = 'left';
        ctx.font = font;
        ctx.fillStyle = '#FFFFFF';
        ctx.fillText(line.text, -bw / 2 + 28, (isAct && S.showTrans && line.trans) ? -14 : 0);
        if (isAct && S.showTrans && line.trans) {
          ctx.font = `500 ${Math.round(H * 0.022)}px sans-serif`;
          ctx.fillStyle = 'rgba(255,255,255,0.78)';
          ctx.fillText(line.trans, -bw / 2 + 28, 18);
        }
        ctx.restore();
      }
      ctx.restore();
      return;
    }

    // 7. TILT — 倾诉（断行斜体强调 + 贴近镜头）
    if (tpl === 'tilt') {
      const enter = easeOutCubic(sinceChange / 0.45);
      const chunks = wrapLines(curText, W * 0.56, `italic 800 ${Math.round(H * 0.075)}px sans-serif`);
      const angle = ((active % 2 === 0 ? -1 : 1) * 0.075) * (1 - enter * 0.25);
      ctx.save();
      ctx.translate(W * 0.5, H * 0.48);
      ctx.rotate(angle);
      const zoom = 0.94 + enter * 0.1 + prog * 0.04;
      ctx.scale(zoom, zoom);
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      const lh = H * 0.105;
      const sy = -((chunks.length - 1) * lh) / 2;
      chunks.forEach((line, idx) => {
        const isEmph = idx === chunks.length - 1;
        ctx.font = `${isEmph ? 'italic 900' : '700'} ${Math.round(H * (isEmph ? 0.082 : 0.066))}px sans-serif`;
        ctx.fillStyle = isEmph ? S.bright : '#FFFFFF';
        ctx.shadowColor = S.accent;
        ctx.shadowBlur = isEmph ? 30 : 12;
        ctx.fillText(line, (idx - 0.5) * 28, sy + idx * lh);
      });
      if (curTrans) {
        ctx.shadowBlur = 0;
        ctx.font = `italic 500 ${Math.round(H * 0.028)}px sans-serif`;
        ctx.fillStyle = 'rgba(255,255,255,0.72)';
        ctx.fillText(curTrans, 0, sy + chunks.length * lh + 20);
      }
      ctx.restore();
      return;
    }

    // 8. CLADDAGH — 回环（倾斜 3D 圆环轨道循环推进）
    if (tpl === 'claddagh') {
      const targetAngle = active * 0.55;
      S.clockAngle = lerp(S.clockAngle, targetAngle, 0.09);
      const rx = W * 0.36, ry = H * 0.24;
      ctx.save();
      ctx.translate(W * 0.5, H * 0.5);
      ctx.rotate(-0.12);
      // Orbit ring guide
      ctx.strokeStyle = rgba(S.bright, 0.18);
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.ellipse(0, 0, rx, ry, 0, 0, Math.PI * 2);
      ctx.stroke();

      const items = [];
      for (let i = Math.max(0, active - 4); i <= Math.min(S.lyrics.length - 1, active + 5); i++) {
        const theta = (i * 0.55 - S.clockAngle) + Math.PI * 0.5;
        const depth = Math.sin(theta); // +1 front, -1 back
        items.push({ i, theta, depth, line: S.lyrics[i] });
      }
      items.sort((a, b) => a.depth - b.depth);
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      for (const it of items) {
        const x = Math.cos(it.theta) * rx;
        const y = Math.sin(it.theta) * ry;
        const sc = 0.55 + (it.depth + 1) * 0.34;
        const isAct = it.i === active;
        ctx.save();
        ctx.translate(x, y);
        ctx.scale(sc, sc);
        ctx.globalAlpha = isAct ? 1 : clamp(0.15 + (it.depth + 1) * 0.24, 0.08, 0.65);
        ctx.font = `${isAct ? 900 : 600} ${Math.round(H * 0.056)}px sans-serif`;
        if (isAct) {
          ctx.shadowColor = S.accent;
          ctx.shadowBlur = 28;
          ctx.fillStyle = '#FFFFFF';
        } else {
          ctx.fillStyle = '#CBD5E1';
        }
        ctx.fillText(it.line.text, 0, 0);
        ctx.restore();
      }
      ctx.restore();
      return;
    }

    // 9. MONET — 莫奈（海报版面：左歌词 + 右封面肖像 + 底频谱）
    if (tpl === 'monet') {
      const rowH = H * 0.105;
      S.camY = lerp(S.camY, active * rowH, 0.1);
      ctx.save();
      // Left lyric rail
      ctx.save();
      ctx.beginPath();
      ctx.rect(W * 0.06, H * 0.12, W * 0.5, H * 0.66);
      ctx.clip();
      ctx.textAlign = 'left';
      ctx.textBaseline = 'middle';
      for (let i = Math.max(0, active - 4); i <= Math.min(S.lyrics.length - 1, active + 5); i++) {
        const line = S.lyrics[i];
        const y = H * 0.44 + (i * rowH - S.camY);
        const isAct = i === active;
        ctx.globalAlpha = isAct ? 1 : 0.34;
        ctx.font = `${isAct ? 800 : 600} ${Math.round(H * (isAct ? 0.048 : 0.036))}px sans-serif`;
        ctx.fillStyle = isAct ? '#FFFFFF' : '#CBD5E1';
        ctx.fillText(line.text, W * 0.07, y);
        if (isAct && S.showTrans && line.trans) {
          ctx.font = `500 ${Math.round(H * 0.023)}px sans-serif`;
          ctx.fillStyle = S.bright;
          ctx.fillText(line.trans, W * 0.07, y + H * 0.042);
        }
      }
      ctx.restore();

      // Right painterly framed portrait / album art
      const boxS = Math.min(W * 0.32, H * 0.54);
      const px = W * 0.61, py = H * 0.18;
      ctx.save();
      ctx.shadowColor = rgba(S.accent, 0.45);
      ctx.shadowBlur = 40;
      drawRoundedRect(px - 8, py - 8, boxS + 16, boxS + 16, 22);
      ctx.fillStyle = rgba(S.bright, 0.16);
      ctx.fill();
      ctx.strokeStyle = rgba(S.bright, 0.42);
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.shadowBlur = 0;
      drawRoundedRect(px, py, boxS, boxS, 16);
      ctx.clip();
      if (S.coverImg && S.coverImg.complete && S.coverImg.naturalWidth > 0) {
        ctx.drawImage(S.coverImg, px, py, boxS, boxS);
      } else {
        const g = ctx.createLinearGradient(px, py, px + boxS, py + boxS);
        g.addColorStop(0, S.orb1); g.addColorStop(1, S.accent);
        ctx.fillStyle = g;
        ctx.fillRect(px, py, boxS, boxS);
      }
      ctx.restore();

      // Bottom audio-reactive spectrum bars
      const bars = 48;
      const bw = (W * 0.86) / bars;
      for (let b = 0; b < bars; b++) {
        const wave = 0.25 + 0.75 * Math.abs(Math.sin(tSec * 4.5 + b * 0.35));
        const bh = (10 + wave * H * 0.08 * (0.35 + S.smoothLevel * 1.4));
        ctx.fillStyle = rgba(b % 2 === 0 ? S.accent : S.bright, 0.65);
        drawRoundedRect(W * 0.07 + b * bw, H * 0.90 - bh, bw * 0.62, bh, 3);
        ctx.fill();
      }
      ctx.restore();
      return;
    }

    // 10. DIORAMA — 镜台（3D Z轴空间穿行 + 点阵地平线）
    if (tpl === 'diorama') {
      S.camY = lerp(S.camY, active, 0.08);
      ctx.save();
      // 3D Perspective floor grid
      ctx.strokeStyle = rgba(S.accent, 0.22);
      ctx.lineWidth = 1;
      const horizonY = H * 0.56;
      for (let gx = -8; gx <= 8; gx++) {
        ctx.beginPath();
        ctx.moveTo(W * 0.5 + gx * 28, horizonY);
        ctx.lineTo(W * 0.5 + gx * 220, H);
        ctx.stroke();
      }
      for (let gz = 0; gz < 8; gz++) {
        const zf = ((gz + (tSec * 0.9) % 1) / 8);
        const y = horizonY + Math.pow(zf, 1.8) * (H - horizonY);
        ctx.beginPath();
        ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
      }

      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      for (let i = Math.min(S.lyrics.length - 1, active + 5); i >= Math.max(0, active - 1); i--) {
        const dz = i - S.camY;
        if (dz < -0.6) continue;
        const persp = 1.0 / (1.0 + Math.max(0, dz) * 0.55);
        const y = H * 0.45 - dz * 32 * persp;
        const isAct = i === active;
        ctx.save();
        ctx.translate(W * 0.5 + Math.sin(tSec * 0.5 + i) * 18 * (1 - persp), y);
        ctx.scale(persp * (isAct ? 1.15 : 1.0), persp * (isAct ? 1.15 : 1.0));
        ctx.globalAlpha = clamp(1 - Math.abs(dz) * 0.24, 0.08, 1);
        ctx.font = `900 ${Math.round(H * 0.07)}px monospace`;
        ctx.shadowColor = S.accent;
        ctx.shadowBlur = isAct ? 32 : 8;
        ctx.fillStyle = isAct ? '#FFFFFF' : S.bright;
        ctx.fillText(S.lyrics[i].text, 0, 0);
        ctx.restore();
      }
      ctx.restore();
      return;
    }

    // 11. PENDOLO — 时计（钟表盘封面 + 弧线擒纵推进）
    if (tpl === 'pendolo') {
      const R = Math.min(W, H) * 0.27;
      const cx = W * 0.30, cy = H * 0.50;
      S.clockAngle = lerp(S.clockAngle, active * 0.36, 0.12);
      ctx.save();
      // Watch dial ring + 60 ticks
      ctx.strokeStyle = rgba(S.bright, 0.35);
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(cx, cy, R, 0, Math.PI * 2);
      ctx.stroke();
      for (let k = 0; k < 60; k++) {
        const a = (k / 60) * Math.PI * 2;
        const inner = k % 5 === 0 ? R - 16 : R - 8;
        ctx.strokeStyle = k % 5 === 0 ? rgba(S.bright, 0.7) : rgba('#FFFFFF', 0.22);
        ctx.lineWidth = k % 5 === 0 ? 2 : 1;
        ctx.beginPath();
        ctx.moveTo(cx + Math.cos(a) * inner, cy + Math.sin(a) * inner);
        ctx.lineTo(cx + Math.cos(a) * (R - 2), cy + Math.sin(a) * (R - 2));
        ctx.stroke();
      }
      // Embedded spinning album cover
      ctx.save();
      ctx.beginPath();
      ctx.arc(cx, cy, R * 0.68, 0, Math.PI * 2);
      ctx.clip();
      ctx.translate(cx, cy);
      ctx.rotate(tSec * (S.isPlaying ? 0.22 : 0));
      if (S.coverImg && S.coverImg.complete && S.coverImg.naturalWidth > 0) {
        ctx.drawImage(S.coverImg, -R * 0.68, -R * 0.68, R * 1.36, R * 1.36);
      } else {
        ctx.fillStyle = S.orb1;
        ctx.fillRect(-R, -R, R * 2, R * 2);
      }
      ctx.restore();
      // Escapement second hand
      const handAng = (posSec * 0.6) - Math.PI / 2;
      ctx.strokeStyle = S.accent;
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.lineTo(cx + Math.cos(handAng) * (R - 14), cy + Math.sin(handAng) * (R - 14));
      ctx.stroke();

      // Lyrics along right outer arc
      ctx.textAlign = 'left';
      ctx.textBaseline = 'middle';
      const arcR = R + 56;
      for (let i = Math.max(0, active - 3); i <= Math.min(S.lyrics.length - 1, active + 4); i++) {
        const ang = (i * 0.36 - S.clockAngle);
        if (Math.abs(ang) > 1.35) continue;
        const x = cx + Math.cos(ang) * arcR;
        const y = cy + Math.sin(ang) * arcR;
        const isAct = i === active;
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(ang * 0.35);
        ctx.globalAlpha = isAct ? 1 : clamp(0.42 - Math.abs(ang) * 0.25, 0.08, 0.42);
        ctx.font = `${isAct ? 800 : 600} ${Math.round(H * (isAct ? 0.048 : 0.034))}px sans-serif`;
        ctx.fillStyle = isAct ? '#FFFFFF' : '#CBD5E1';
        ctx.fillText(S.lyrics[i].text, 0, 0);
        ctx.restore();
      }
      ctx.restore();
      return;
    }

    // 12. SONNET — 商籁（诗稿边框 + 镂空巨字水印 + 翻页排布）
    if (tpl === 'sonnet') {
      const enter = easeOutCubic(sinceChange / 0.45);
      ctx.save();
      // Editorial manuscript border
      const pad = 44;
      ctx.strokeStyle = rgba(S.bright, 0.28);
      ctx.lineWidth = 1.5;
      ctx.strokeRect(pad, pad, W - pad * 2, H - pad * 2);
      // Giant hollow outline watermark
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.font = `900 ${Math.round(H * 0.26)}px serif`;
      ctx.strokeStyle = rgba(S.bright, 0.14);
      ctx.lineWidth = 2;
      ctx.strokeText(curText.slice(0, 4), W * 0.5, H * 0.52);

      // Hairline ornament
      ctx.strokeStyle = S.accent;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(W * 0.42, H * 0.35);
      ctx.lineTo(W * 0.58, H * 0.35);
      ctx.stroke();

      // Main poetic verse
      ctx.globalAlpha = enter;
      ctx.font = `700 ${Math.round(H * 0.058)}px serif`;
      ctx.fillStyle = '#F8FAFC';
      ctx.fillText(curText, W * 0.5, H * 0.48 + (1 - enter) * 18);
      if (curTrans) {
        ctx.font = `500 ${Math.round(H * 0.026)}px serif`;
        ctx.fillStyle = rgba(S.bright, 0.8);
        ctx.fillText(curTrans, W * 0.5, H * 0.58);
      }
      // Page number
      ctx.font = `600 13px monospace`;
      ctx.fillStyle = rgba('#FFFFFF', 0.45);
      ctx.fillText(`FOLIO ${String(Math.max(1, active + 1)).padStart(2, '0')} / ${String(Math.max(1, S.lyrics.length)).padStart(2, '0')}`, W * 0.5, H - pad - 24);
      ctx.restore();
      return;
    }

    // 13. TEMPERA — 凝彩（重组色块 + 反色混合文字）
    if (tpl === 'tempera') {
      ctx.save();
      // Animated geometric color blocks
      const b1x = W * (0.12 + 0.08 * Math.sin(tSec * 0.4));
      const b2x = W * (0.52 + 0.07 * Math.cos(tSec * 0.35));
      ctx.fillStyle = rgba(S.accent, 0.78);
      ctx.fillRect(b1x, H * 0.22, W * 0.38, H * 0.52);
      ctx.fillStyle = rgba(S.bright, 0.72);
      ctx.fillRect(b2x, H * 0.34, W * 0.34, H * 0.44);
      // Halftone dot accents
      ctx.fillStyle = 'rgba(255,255,255,0.16)';
      for (let gx = 0; gx < 14; gx++) {
        for (let gy = 0; gy < 7; gy++) {
          ctx.beginPath();
          ctx.arc(W * 0.14 + gx * 22, H * 0.24 + gy * 22, 2.2, 0, Math.PI * 2);
          ctx.fill();
        }
      }
      // Difference-blended bold lyrics invert over color blocks
      ctx.globalCompositeOperation = 'difference';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.font = `900 ${Math.round(H * 0.076)}px sans-serif`;
      ctx.fillStyle = '#FFFFFF';
      ctx.fillText(curText, W * 0.5, H * 0.49);
      if (curTrans) {
        ctx.font = `600 ${Math.round(H * 0.03)}px sans-serif`;
        ctx.fillText(curTrans, W * 0.5, H * 0.60);
      }
      ctx.restore();
      return;
    }

    // 14. LUMIERE — 绘光（体积光束穿过浮尘 + 光照刻字）
    if (tpl === 'lumiere') {
      ctx.save();
      // Volumetric god-rays from top-left
      const beamX = W * (0.2 + prog * 0.6);
      const grad = ctx.createLinearGradient(W * 0.18, 0, beamX, H);
      grad.addColorStop(0, rgba(S.bright, 0.36));
      grad.addColorStop(0.55, rgba(S.accent, 0.16));
      grad.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.moveTo(W * 0.10, 0);
      ctx.lineTo(W * 0.30, 0);
      ctx.lineTo(beamX + W * 0.26, H);
      ctx.lineTo(beamX - W * 0.22, H);
      ctx.closePath();
      ctx.fill();

      // Floating dust motes
      for (let m = 0; m < 28; m++) {
        const mx = ((hash(m * 11) * W + tSec * (12 + m % 7)) % W);
        const my = ((hash(m * 19) * H + Math.sin(tSec + m) * 24) % H);
        ctx.fillStyle = rgba(S.bright, 0.25 + 0.35 * hash(m * 3));
        ctx.beginPath();
        ctx.arc(mx, my, 1.5 + (m % 3), 0, Math.PI * 2);
        ctx.fill();
      }

      // Chiseled illuminated lyric
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.font = `800 ${Math.round(H * 0.068)}px serif`;
      ctx.fillStyle = 'rgba(255,255,255,0.22)';
      ctx.fillText(curText, W * 0.5, H * 0.49);

      // Spotlight sweep mask illuminating the text
      const litGrad = ctx.createLinearGradient(beamX - 240, 0, beamX + 240, 0);
      litGrad.addColorStop(0, 'rgba(255,255,255,0)');
      litGrad.addColorStop(0.5, '#FFFFFF');
      litGrad.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.shadowColor = S.bright;
      ctx.shadowBlur = 28;
      ctx.fillStyle = litGrad;
      ctx.fillText(curText, W * 0.5, H * 0.49);
      if (curTrans) {
        ctx.shadowBlur = 0;
        ctx.font = `500 ${Math.round(H * 0.026)}px sans-serif`;
        ctx.fillStyle = rgba('#E2E8F0', 0.72);
        ctx.fillText(curTrans, W * 0.5, H * 0.60);
      }
      ctx.restore();
      return;
    }

    // 15. NEBBIA — 雾笺（毛玻璃卡片 + 拨雾浮现）
    if (tpl === 'nebbia') {
      ctx.save();
      const cardW = W * 0.74, cardH = H * 0.40;
      const cx = (W - cardW) / 2, cy = (H - cardH) / 2;
      // Frosted glass card
      drawRoundedRect(cx, cy, cardW, cardH, 28);
      ctx.fillStyle = 'rgba(255,255,255,0.08)';
      ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.22)';
      ctx.lineWidth = 1.5;
      ctx.stroke();

      // Mist wisps drifting across
      for (let k = 0; k < 3; k++) {
        const mx = W * (0.25 + k * 0.25) + Math.sin(tSec * 0.4 + k) * 90;
        const mg = ctx.createRadialGradient(mx, H * 0.5, 10, mx, H * 0.5, W * 0.28);
        mg.addColorStop(0, rgba('#FFFFFF', 0.10));
        mg.addColorStop(1, 'rgba(255,255,255,0)');
        ctx.fillStyle = mg;
        ctx.fillRect(0, 0, W, H);
      }

      const reveal = easeOutCubic(sinceChange / 0.55);
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.globalAlpha = reveal;
      ctx.font = `700 ${Math.round(H * 0.056)}px sans-serif`;
      ctx.fillStyle = '#FFFFFF';
      ctx.shadowColor = rgba(S.bright, 0.5);
      ctx.shadowBlur = (1 - reveal) * 28 + 8;
      ctx.fillText(curText, W * 0.5, H * 0.47);
      if (curTrans) {
        ctx.shadowBlur = 0;
        ctx.font = `500 ${Math.round(H * 0.026)}px sans-serif`;
        ctx.fillStyle = rgba(S.bright, 0.8);
        ctx.fillText(curTrans, W * 0.5, H * 0.57);
      }
      ctx.restore();
      return;
    }

    // 16. METAPHOR — 隐喻（极简电影画幅 + 几何留白）
    if (tpl === 'metaphor') {
      ctx.save();
      // Cinema letterbox bars
      const barH = H * 0.11;
      ctx.fillStyle = 'rgba(0,0,0,0.82)';
      ctx.fillRect(0, 0, W, barH);
      ctx.fillRect(0, H - barH, W, barH);
      // Crosshair geometric axis
      ctx.strokeStyle = rgba(S.bright, 0.24);
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(W * 0.1, H * 0.5); ctx.lineTo(W * 0.9, H * 0.5);
      ctx.stroke();

      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.font = `700 ${Math.round(H * 0.048)}px sans-serif`;
      ctx.fillStyle = '#FFFFFF';
      ctx.fillText(curText, W * 0.5, H * 0.44);
      if (curTrans) {
        ctx.font = `500 ${Math.round(H * 0.024)}px sans-serif`;
        ctx.fillStyle = rgba(S.bright, 0.82);
        ctx.fillText(curTrans, W * 0.5, H * 0.56);
      }
      ctx.restore();
      return;
    }

    // 17. HANABI — 花火（夜空粒子花火绽放）
    if (tpl === 'hanabi') {
      ctx.save();
      // Update & draw firework particles
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.045;
        p.vx *= 0.985;
        p.life -= p.decay;
        if (p.life <= 0) { particles.splice(i, 1); continue; }
        ctx.globalAlpha = p.life;
        ctx.fillStyle = p.color;
        ctx.shadowColor = p.color;
        ctx.shadowBlur = 12;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      const pop = easeOutBack(sinceChange / 0.42);
      ctx.translate(W * 0.5, H * 0.50);
      ctx.scale(pop, pop);
      ctx.font = `800 ${Math.round(H * 0.064)}px sans-serif`;
      ctx.shadowColor = S.accent;
      ctx.shadowBlur = 32;
      ctx.fillStyle = '#FFFFFF';
      ctx.fillText(curText, 0, 0);
      if (curTrans) {
        ctx.shadowBlur = 0;
        ctx.font = `500 ${Math.round(H * 0.026)}px sans-serif`;
        ctx.fillStyle = S.bright;
        ctx.fillText(curTrans, 0, H * 0.072);
      }
      ctx.restore();
      return;
    }

    // 18. MACHI — 町景（都市夜色霓虹灯牌构图）
    if (tpl === 'machi') {
      ctx.save();
      // Vertical neon signboard on right
      const signX = W * 0.84, signY = H * 0.14, signW = 74, signH = H * 0.68;
      ctx.strokeStyle = S.accent;
      ctx.lineWidth = 3;
      ctx.shadowColor = S.accent;
      ctx.shadowBlur = 20;
      drawRoundedRect(signX, signY, signW, signH, 10);
      ctx.stroke();
      ctx.font = '800 22px sans-serif';
      ctx.fillStyle = S.bright;
      ctx.textAlign = 'center';
      const vTitle = Array.from((S.track.name || '夜色町景').slice(0, 8));
      vTitle.forEach((ch, idx) => ctx.fillText(ch, signX + signW / 2, signY + 42 + idx * 34));

      // Main neon horizontal billboard lyric
      ctx.shadowColor = S.accent;
      ctx.shadowBlur = 30;
      ctx.textAlign = 'left';
      ctx.textBaseline = 'middle';
      ctx.font = `900 ${Math.round(H * 0.068)}px sans-serif`;
      ctx.fillStyle = '#FFFFFF';
      ctx.fillText(curText, W * 0.09, H * 0.46);
      if (curTrans) {
        ctx.shadowBlur = 12;
        ctx.font = `600 ${Math.round(H * 0.028)}px sans-serif`;
        ctx.fillStyle = S.bright;
        ctx.fillText(curTrans, W * 0.09, H * 0.57);
      }
      // Rain streaks
      ctx.shadowBlur = 0;
      ctx.strokeStyle = 'rgba(255,255,255,0.14)';
      ctx.lineWidth = 1;
      for (let r = 0; r < 24; r++) {
        const rx = (hash(r * 7) * W);
        const ry = ((hash(r * 13) * H + tSec * 420) % H);
        ctx.beginPath();
        ctx.moveTo(rx, ry); ctx.lineTo(rx - 4, ry + 26);
        ctx.stroke();
      }
      ctx.restore();
      return;
    }
  }

  // Subtle top-left track HUD
  function drawHud() {
    if (!S.track.name) return;
    ctx.save();
    ctx.textAlign = 'left';
    ctx.textBaseline = 'top';
    ctx.font = '700 18px sans-serif';
    ctx.fillStyle = 'rgba(248,250,252,0.88)';
    ctx.fillText(S.track.name, 48, 30);
    ctx.font = '500 13px sans-serif';
    ctx.fillStyle = 'rgba(203,213,225,0.68)';
    ctx.fillText(`${S.track.singer || ''}  ·  FOLIA ${S.template.toUpperCase()}`, 48, 54);
    ctx.restore();
  }

  // ======================== Main 60fps Loop ========================
  function frame(now) {
    const tSec = now / 1000;
    const elapsedMs = S.isPlaying ? (now - S.lastTickPerf) : 0;
    const posSec = Math.max(0, (S.posMs + clamp(elapsedMs, 0, 250)) / 1000);
    S.smoothLevel = lerp(S.smoothLevel, S.level, 0.18);

    const active = findActiveIndex(posSec);
    if (active !== S.activeIdx) {
      S.prevActiveIdx = S.activeIdx;
      S.activeIdx = active;
      S.lineChangedAt = tSec;
      if (S.template === 'hanabi') {
        const cx = S.w * (0.22 + Math.random() * 0.56);
        const cy = S.h * (0.20 + Math.random() * 0.40);
        spawnFirework(cx, cy, Math.random() > 0.5 ? S.accent : S.bright);
      }
    }

    renderBg(tSec);
    ctx.clearRect(0, 0, S.w, S.h);
    const prog = active >= 0 ? lineProgress(active, posSec) : 0;
    const sinceChange = Math.max(0, tSec - S.lineChangedAt);
    drawTemplate(S.template, tSec, posSec, active, prog, sinceChange);
    drawHud();

    requestAnimationFrame(frame);
  }

  // ======================== Native Bridge ========================
  window.__foliaState = function(payload) {
    if (!payload) return;
    if (payload.template) S.template = payload.template;
    if (payload.track) {
      S.track = payload.track;
      const url = payload.track.picURL || '';
      if (url && url !== S.coverUrlLoaded) {
        S.coverUrlLoaded = url;
        const img = new Image();
        img.crossOrigin = 'anonymous';
        img.src = url;
        S.coverImg = img;
      }
    }
    if (Array.isArray(payload.lyrics)) {
      S.lyrics = payload.lyrics;
      S.activeIdx = -1;
    }
    if (typeof payload.showTrans === 'boolean') S.showTrans = payload.showTrans;
    if (payload.accent) S.accent = payload.accent;
    if (payload.bright) S.bright = payload.bright;
    if (payload.orb1) S.orb1 = payload.orb1;
    if (payload.orb2) S.orb2 = payload.orb2;
  };

  window.__foliaTick = function(posMs, isPlaying, level) {
    S.posMs = posMs || 0;
    S.isPlaying = !!isPlaying;
    S.level = level || 0;
    S.lastTickPerf = performance.now();
  };

  window.addEventListener('resize', resize);
  initBg();
  resize();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
