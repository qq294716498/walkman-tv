name: Recommendation UI Preview

on:
  push:
    branches:
      - feature/recommend-personalized-ui-preview
    paths-ignore:
      - docs/screenshots/recommend-personalized-preview.png

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile the TV app
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Capture the actual recommendation screen
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: tv_1080p
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          script: |
            adb shell wm size 1920x1080
            adb shell wm density 240
            adb install "$(find app/build/outputs/apk/debug -name '*-x86_64-debug.apk' -print -quit)"
            adb shell am start -W -n com.walkman.tv.autosource/com.walkman.tv.MainActivity
            sleep 20
            adb shell pidof com.walkman.tv.autosource
            mkdir -p docs/screenshots
            adb exec-out screencap -p > docs/screenshots/recommend-personalized-preview.png
            test "$(stat -c%s docs/screenshots/recommend-personalized-preview.png)" -gt 10000
      - name: Upload screenshot
        uses: actions/upload-artifact@v4
        with:
          name: recommendation-ui-preview
          path: docs/screenshots/recommend-personalized-preview.png
          if-no-files-found: error
      - name: Save screenshot to the preview branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots/recommend-personalized-preview.png
          git commit -m "docs: capture recommendation UI from Android TV emulator"
          git push origin HEAD:feature/recommend-personalized-ui-preview
